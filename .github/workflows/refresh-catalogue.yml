name: Refresh repository catalogue

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-repository-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'HCL-TECH-SOFTWARE/HCL-TECH-SOFTWARE.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh repository data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-catalogue.mjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/repositories.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repositories.json
          git commit -m "Refresh repository catalogue"
          git push
